# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo root (app/) and apply this blueprint, then add secrets in the dashboard.
services:
  - type: web
    name: blink-bling
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm run build:deploy
    startCommand: pnpm run start:deploy
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
