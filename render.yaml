# Render Blueprint — https://render.com/docs/blueprint-spec
# 1. Push this repo to GitHub
# 2. Go to render.com → New → Blueprint → connect the repo
# 3. Add the secret env vars marked sync:false in the Render dashboard
services:
  - type: web
    name: blink-bling
    runtime: node
    plan: free
    buildCommand: pnpm install && node server/build.mjs
    startCommand: pnpm run start:deploy
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true

      # Supabase — add values in Render dashboard
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

      # ElevenLabs voice AI — add values in Render dashboard
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_LUNA_AGENT_ID
        sync: false

      # AI image generation — add values in Render dashboard
      - key: OPENAI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: black-forest-labs/flux-1.1-pro
